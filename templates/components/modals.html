<!-- templates/components/modals.html - Dialogs and Modals -->

<!-- Memory Modal (Instagram Anti-ban accounts rotation) -->
<div id="memoryModal" class="hidden fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-surface-container-low border border-[#262a35] rounded-xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
    <div class="px-5 py-3.5 bg-surface-container border-b border-[#262a35] flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[20px]">manage_accounts</span>
        <h3 class="font-bold text-sm text-on-surface">Memoria de Cuentas & Rotación Anti-Baneo</h3>
      </div>
      <button onclick="closeMemoryModal()" class="text-on-surface-variant hover:text-on-surface p-1 rounded transition">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
    
    <div id="memoryModalContent" class="p-5 overflow-y-auto space-y-3 flex-1 font-mono text-xs">
      <!-- Injected by refreshMemoryModal() -->
    </div>

    <div class="px-5 py-3 bg-surface-container border-t border-[#262a35] flex items-center justify-between">
      <button onclick="refreshMemoryModal()" class="px-3 py-1.5 rounded bg-surface-container-high hover:bg-surface-container-highest text-on-surface text-xs font-mono font-medium flex items-center gap-1 transition">
        <span class="material-symbols-outlined text-[14px]">refresh</span> Refrescar
      </button>
      <button onclick="closeMemoryModal()" class="px-4 py-1.5 rounded bg-primary text-on-primary text-xs font-bold font-mono transition">
        Cerrar
      </button>
    </div>
  </div>
</div>

<!-- Screen Expand / Zoom Modal -->
<div id="screenModal" class="hidden fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4" onclick="if(event.target === this) this.classList.add('hidden')">
  <div class="relative max-w-3xl w-full max-h-[90vh] flex flex-col items-center">
    <button onclick="document.getElementById('screenModal').classList.add('hidden')" class="absolute -top-10 right-0 text-white hover:text-primary transition flex items-center gap-1 text-xs font-mono">
      <span class="material-symbols-outlined text-[20px]">close</span> Cerrar
    </button>
    <img id="screenModalImg" src="/api/screen" alt="Captura Ampliada" class="max-h-[85vh] w-auto rounded-lg shadow-2xl border border-[#262a35]">
  </div>
</div>

<!-- Icon Matcher Debug Modal -->
<div id="debugMatchModal" class="hidden fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4" onclick="if(event.target === this) toggleDebugMatchModal()">
  <div class="bg-surface-container-low border border-[#262a35] rounded-xl max-w-2xl w-full overflow-hidden shadow-2xl flex flex-col">
    <div class="px-4 py-3 bg-surface-container border-b border-[#262a35] flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[18px]">bug_report</span>
        <h3 class="font-bold text-xs text-on-surface">Depuración de Coincidencia OpenCV</h3>
      </div>
      <button onclick="toggleDebugMatchModal()" class="text-on-surface-variant hover:text-on-surface p-1 rounded">
        <span class="material-symbols-outlined text-[16px]">close</span>
      </button>
    </div>
    <div class="p-4 flex items-center justify-center bg-black/50">
      <img id="debugMatchImg" src="/api/icons/debug-image" alt="Debug Heatmap" class="max-h-[70vh] w-auto rounded border border-[#262a35]" onerror="this.alt='Sin imagen de depuración reciente'">
    </div>
  </div>
</div>
